name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call: # deploy.yml runs this before deploying

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test -race ./...

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: routewise
          POSTGRES_PASSWORD: routewise
          POSTGRES_DB: routewise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routewise -d routewise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests (//go:build integration) apply backend/migrations to this empty
      # database themselves and never call real Twilio/Google/AWS.
      TEST_DATABASE_URL: postgres://routewise:routewise@localhost:5432/routewise_test?sslmode=disable
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Integration tests
        run: go test -tags integration -count=1 -p 1 ./...

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Tests
        run: npm test -- --watchAll=false
        env:
          CI: true
